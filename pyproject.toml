[project]
name = "maze"
version = "0.1.0"
description = "VAST — controller, pipeline, and core for vibration actuating search task"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.21.0",
    "h5py>=3.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "opencv-python>=4.5.0",
    "tqdm>=4.60.0",
    "pyserial>=3.5",
    "vmbpy",
    "h5grove[flask]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "vulture>=2.15",
]
gui = [
    "PySide6>=6.0",
]
sleap = [
    "sleap-io",
    # Force CUDA-enabled PyTorch wheels in the same uv environment.
    # (Without explicit torch pins, uv may resolve to CPU-only torch.)
    # CUDA wheels are only available for win32/linux; for other platforms
    # fall back to CPU wheels so uv's resolver can still find a solution.
    "sleap-nn[torch-cuda130]; sys_platform == 'win32' or sys_platform == 'linux'",
    "sleap-nn; sys_platform != 'win32' and sys_platform != 'linux'",
    "torch==2.10.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.25.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.10.0; sys_platform != 'win32' and sys_platform != 'linux'",
    "torchvision==0.25.0; sys_platform != 'win32' and sys_platform != 'linux'",
]
kpms = [
    "keypoint-moseq==0.6.3", # jax has no cuda support on x86_64
]

[project.scripts]
maze-daq = "maze.controller.acquisition.__main__:main"
vast-daq = "maze.controller.acquisition.__main__:main"
maze-ram-daq = "maze.controller.acquisition_ram.__main__:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maze"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
