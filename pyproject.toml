[project]
name = "maze"
version = "0.1.0"
description = "OEM — controller, pipeline, and core for ethology behavior maze tasks"
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.21.0",
    "h5py>=3.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    # Linux/WSL headless: opencv-python pulls libGL (fails in WSL without mesa/GL).
    "opencv-python>=4.5.0; sys_platform != 'linux'",
    "opencv-python-headless>=4.5.0; sys_platform == 'linux'",
    "tqdm>=4.60.0",
    "pyserial>=3.5",
    "vmbpy",
    # h5web viewer + maze-local-service HTTP stack (no Qt)
    "h5grove[flask]>=4.0.0rc0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.0",
]
sleap = [
    "sleap-io",
    # Force CUDA-enabled PyTorch wheels in the same uv environment.
    # (Without explicit torch pins, uv may resolve to CPU-only torch.)
    # CUDA wheels are only available for win32/linux; for other platforms
    # fall back to CPU wheels so uv's resolver can still find a solution.
    "sleap-nn[torch-cuda130]; sys_platform == 'win32' or sys_platform == 'linux'",
    "sleap-nn; sys_platform != 'win32' and sys_platform != 'linux'",
    "torch==2.10.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.25.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.10.0; sys_platform != 'win32' and sys_platform != 'linux'",
    "torchvision==0.25.0; sys_platform != 'win32' and sys_platform != 'linux'",
]
local-service = [
    "waitress",
    "llama-cpp-python",
    "ultralytics",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "black",
    "mypy",
    "vulture",
    "pydeps",
    "graphviz",
    "httpx",
    "rich",
]
# jax<0.7: tensorflow_probability (via jax-moseq) still uses APIs removed in JAX 0.7
# (see keypoint-moseq setup.cfg install_requires). Without these pins, uv can pull jax>=0.7.
# Linux/WSL: jax[cuda12] pulls CUDA jaxlib; Windows kpMS fit stays CPU-only.
kpms = [
    "keypoint-moseq==0.6.3",
    "jax[cuda12]<0.7.0; sys_platform == 'linux'",
    "jax<0.7.0; sys_platform != 'linux'",
    "jaxlib<0.7.0; sys_platform != 'linux'",
    "pyyaml>=6.0",
    "hdbscan>=0.8.33",
]

lab = ["maze[gui,sleap,local-service,kpms,dev]"]

[project.scripts]
maze-daq = "maze.controller.acquisition.__main__:main"
vast-daq = "maze.controller.acquisition.__main__:main"
maze-ram-daq = "maze.controller.acquisition.radial_arm.__main__:main"
maze-legacy-db = "maze.cli.legacy_db:main"
maze-render-trial-overlay = "maze.cli.render_trial_overlay:main"
maze-render-ram-trial-overlay = "maze.cli.render_ram_trial_overlay:main"
maze-reprocess-controller-h5 = "maze.cli.reprocess_controller_h5:main"
maze-trial-summary-dictionary = "maze.cli.trial_summary_data_dictionary:main"
maze-kpms-review-artifacts = "maze.cli.kpms_review_artifacts:main"
maze-kpms-apply-syllable-merge = "maze.cli.kpms_apply_syllable_merge:main"
maze-kpms-clean-syllable-bouts = "maze.cli.kpms_clean_syllable_bouts:main"
maze-kpms-build-training-exemplar-table = "maze.cli.build_kpms_training_exemplar_table:main"
maze-kpms-cpu-ensemble-sweep = "maze.cli.kpms_cpu_ensemble_sweep:main"
maze-generate-selected-trials-nor-kpms = "maze.cli.generate_selected_trials_from_nor_kpms_results:main"
maze-overlay-slp-bout = "maze.cli.overlay_slp_bout_pipeline:main"
maze-export-ram-trial-manifest = "maze.cli.export_ram_trial_manifest_csv:main"
maze-fix-ele-h5-session-animal-ids = "maze.cli.fix_ele_h5_session_animal_ids:main"
maze-average-block-dwell-plots = "maze.cli.average_block_dwell_plots:main"
maze-sleap-nn-batch-inference = "maze.cli.sleap_nn_batch_inference:main"
maze-kpms-fit = "maze.kpms.fit:main"
maze-kpms-apply = "maze.kpms.apply:main"
maze-compile-bout-features = "maze.cli.compile_bout_features:main"
maze-cluster-bouts-hdbscan = "maze.cli.cluster_bouts_hdbscan:main"
maze-fit-bout-arhmm = "maze.cli.fit_bout_arhmm:main"
maze-preview-behavior-token-grid = "maze.cli.preview_behavior_token_grid:main"
maze-init-behavior-token-labels = "maze.cli.init_behavior_token_labels:main"
maze-export-bout-arhmm-labeling = "maze.cli.export_bout_arhmm_labeling:main"
maze-mine-syllable-grammar-candidates = "maze.cli.mine_syllable_grammar_candidates:main"
maze-build-grammar-rules = "maze.cli.build_grammar_rules:main"
maze-preview-grammar-candidate = "maze.cli.preview_grammar_candidate:main"
maze-export-syllable-grammar-labeling = "maze.cli.export_syllable_grammar_labeling:main"
maze-calibrate-locomotion-tiers = "maze.cli.calibrate_locomotion_tiers:main"
maze-block-ethogram-exports = "maze.cli.block_ethogram_exports:main"
maze-build-is-moving-anchor = "maze.cli.build_is_moving_anchor:main"
maze-evaluate-behavior-producers = "maze.cli.evaluate_behavior_producers:main"
maze-langfuse-demo = "maze.cli.langfuse_demo:main"
maze-local-service = "maze.controller.local_service.__main__:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maze"]

[tool.ruff]
line-length = 180
extend-exclude = ["scripts/archive"]

[tool.black]
line-length = 180
extend-exclude = "/(scripts\\/archive)/"

# Dead-code finder (optional dev dependency). From ORM/: ``uv run vulture``
# CLI flags override these settings. Lower min_confidence for more hits (more false positives).
[tool.vulture]
paths = ["maze"]
exclude = ["tests/", "scripts/archive/"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" on path so pytest_plugins can load controller.local_service.fixtures (see root conftest.py).
# Do not use tests.* — a dependency installs a top-level "tests" package in site-packages.
pythonpath = ["tests", "."]
markers = [
    "llm_integration: optional discover test requiring MAZE_LLM_GGUF and local-service extra",
    "yolo_integration: optional detect test requiring MAZE_YOLO_WEIGHTS and local-service extra",
]
