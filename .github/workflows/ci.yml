name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync lean core + dev tools
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check maze tests

      - name: Black
        run: uv run black --check tests

      - name: Pytest
        run: uv run pytest tests/ -q
